name: Book Library CI/CD Pipeline

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: book-library-release
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: Build, Test and Deploy
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit tests/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::174302433391:role/book-library-github-actions-role
          aws-region: ap-southeast-4

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push BookManager
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: book-library
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE" .

          docker run -d --name bookmanager-test -p 8080:80 "$IMAGE"

          sleep 3
          curl -f http://localhost:8080/
          curl -f http://localhost:8080/backend/health.php

          docker rm -f bookmanager-test

          docker push "$IMAGE"

          echo "Successfully uploaded $IMAGE"

      - name: Deploy BookManager to Test EC2
        env:
          INSTANCE_ID: i-075ec2dbc29efe79e
        run: |
          REGION="ap-southeast-4"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com"
          IMAGE="$REGISTRY/book-library:$GITHUB_SHA"

          SCRIPT_BASE64=$(base64 -w 0 scripts/deploy-test.sh)

          echo "Deploying $IMAGE with automatic rollback"

          COMMANDS=$(jq -nc \
            --arg registry "$REGISTRY" \
            --arg image "$IMAGE" \
            --arg script "$SCRIPT_BASE64" \
            '{
              commands: [
                "set -e",
                ("aws ecr get-login-password --region ap-southeast-4 | docker login --username AWS --password-stdin " + $registry),
                ("printf %s " + $script + " | base64 -d > /tmp/book-library-deploy-test.sh"),
                ("bash /tmp/book-library-deploy-test.sh " + $image)
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query Status \
            --output text)

          test "$STATUS" = "Success"

      - name: Mark image as tested
        run: |
          echo "Marking $GITHUB_SHA as tested..."

          aws ecr batch-get-image \
            --repository-name book-library \
            --image-ids imageTag="$GITHUB_SHA" \
            --query 'images[0].imageManifest' \
            --output text > manifest.json

          aws ecr put-image \
            --repository-name book-library \
            --image-tag "tested-$GITHUB_SHA" \
            --image-manifest file://manifest.json

          echo "Image successfully verified and tagged!"

      - name: Deploy to Production
        if: ${{ vars.AUTO_PROMOTE == 'true' }}
        env:
          INSTANCE_ID: i-04d2c90c7a0e73710
        run: |
          REGION="ap-southeast-4"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com"
          IMAGE="$REGISTRY/book-library:tested-$GITHUB_SHA"

          SCRIPT_BASE64=$(base64 -w 0 scripts/deploy-prod.sh)

          echo "Automatically promoting verified image: $IMAGE"

          COMMANDS=$(jq -nc \
            --arg registry "$REGISTRY" \
            --arg image "$IMAGE" \
            --arg script "$SCRIPT_BASE64" \
            '{
              commands: [
                "set -e",
                ("aws ecr get-login-password --region ap-southeast-4 | docker login --username AWS --password-stdin " + $registry),
                ("printf %s " + $script + " | base64 -d > /tmp/book-library-deploy-prod.sh"),
                ("bash /tmp/book-library-deploy-prod.sh " + $image)
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query Status \
            --output text)

          test "$STATUS" = "Success"

          echo "Production deployment successful!"