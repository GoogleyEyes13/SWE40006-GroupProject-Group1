name: Book Library CI/CD Pipeline

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: book-library-release
  cancel-in-progress: false
  queue: max

env:
  AWS_REGION: ap-southeast-4
  AWS_ROLE_ARN: arn:aws:iam::174302433391:role/book-library-github-actions-role
  ECR_REGISTRY: 174302433391.dkr.ecr.ap-southeast-4.amazonaws.com
  ECR_REPOSITORY: book-library
  TEST_INSTANCE_ID: i-075ec2dbc29efe79e
  PROD_INSTANCE_ID: i-04d2c90c7a0e73710
  TEST_URL: http://16.50.175.4
  PROD_URL: http://16.27.136.142
  E2E_EMAIL: e2e-${{ github.run_id }}-${{ github.run_attempt }}@example.test

jobs:
  deploy:
    name: Build, Test and Deploy
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint PHP and shell scripts
        run: |
          find BookManager/backend database tests -name '*.php' -print0 | xargs -0 -n1 php -l
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --log-junit reports/phpunit.xml

      - name: Build Docker image
        run: docker build --pull --build-arg APP_VERSION="$GITHUB_SHA" -t book-library:ci .

      - name: Smoke test Docker image
        run: |
          docker run -d --name bookmanager-ci -p 8080:80 book-library:ci
          trap 'docker rm -f bookmanager-ci >/dev/null' EXIT

          for _ in $(seq 1 15); do
            if curl -fsS http://localhost:8080/ >/dev/null &&
               curl -fsS http://localhost:8080/backend/health.php &&
               curl -fsS http://localhost:8080/backend/auth.php >/dev/null &&
               docker exec bookmanager-ci php -r 'exit(extension_loaded("pdo_pgsql") ? 0 : 1);'; then
              echo
              echo "Docker image is working."
              exit 0
            fi
            sleep 2
          done

          echo "Docker image failed the smoke test."
          docker logs bookmanager-ci
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push image to Amazon ECR
        id: push
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image for $GITHUB_SHA is already in ECR."
          else
            docker tag book-library:ci "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          fi

          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          echo "Image digest: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy to Test EC2
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: bash scripts/ssm-deploy.sh "$TEST_INSTANCE_ID" test "$IMAGE"

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - name: Install end-to-end test dependencies
        run: |
          pip install -r tests/e2e/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run end-to-end acceptance tests
        id: e2e
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          pytest tests/e2e \
            --base-url "$TEST_URL" \
            --browser chromium \
            --tracing retain-on-failure \
            --output reports/e2e-traces \
            --junitxml reports/e2e.xml

      - name: Remove end-to-end test account
        if: always() && steps.e2e.outcome != 'skipped'
        run: |
          bash scripts/ssm-run.sh "$TEST_INSTANCE_ID" \
            "docker exec book-library-test php /opt/book-library/database/delete_test_user.php $E2E_EMAIL"

      - name: Mark image as tested
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="tested-$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image is already marked as tested."
            exit 0
          fi

          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageDigest="$DIGEST" \
            --accepted-media-types \
              application/vnd.docker.distribution.manifest.v2+json \
              application/vnd.docker.distribution.manifest.list.v2+json \
              application/vnd.oci.image.manifest.v1+json \
              application/vnd.oci.image.index.v1+json \
            --query 'images[0].imageManifest' \
            --output text)

          aws ecr put-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-tag "tested-$GITHUB_SHA" \
            --image-manifest "$MANIFEST" >/dev/null

          echo "Image $DIGEST marked as tested-$GITHUB_SHA"

      - name: Deploy to Production EC2
        if: vars.AUTO_PROMOTE == 'true'
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: bash scripts/ssm-deploy.sh "$PROD_INSTANCE_ID" production "$IMAGE"

      - name: Verify live Production
        if: vars.AUTO_PROMOTE == 'true'
        run: bash scripts/verify-deployment.sh "$PROD_URL" "$GITHUB_SHA"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports-${{ github.sha }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
