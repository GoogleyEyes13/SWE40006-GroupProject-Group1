name: AWS Connection Test

on:
  push:
    branches: [ci-setup-egor]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-test:
    name: Test AWS Connection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Check OIDC Identity
        run: |
          curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c 'import sys,json,base64; t=json.load(sys.stdin)["value"]; p=t.split(".")[1]; d=json.loads(base64.urlsafe_b64decode(p+"===")); print("Subject:",d["sub"]); print("Audience:",d["aud"])'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::174302433391:role/book-library-github-actions-role
          aws-region: ap-southeast-4

      - name: Verify AWS connection
        run: |
          aws sts get-caller-identity
          echo "Successfully connected to AWS!"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push BookManager
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: book-library
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          # Build the actual PHP application
          docker build -t "$IMAGE" .

          # Run the application temporarily
          docker run -d --name bookmanager-test -p 8080:80 "$IMAGE"

          # Verify frontend and PHP backend
          sleep 3
          curl -f http://localhost:8080/
          curl -f http://localhost:8080/backend/health.php

          # Clean up test container
          docker rm -f bookmanager-test

          # Upload verified image to AWS ECR
          docker push "$IMAGE"

          echo "Successfully uploaded $IMAGE"

      - name: Test EC2 connection via SSM
        env:
          INSTANCE_ID: i-075ec2dbc29efe79e
        run: |
          echo "Sending command to Testing EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["echo Hello from GitHub Actions","hostname","whoami"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text