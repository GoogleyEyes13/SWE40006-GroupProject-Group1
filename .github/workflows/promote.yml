name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "SHA of the tested Docker image"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: book-library-release
  cancel-in-progress: false
  queue: max

jobs:
  promote:
    name: Deploy Tested Image
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::174302433391:role/book-library-github-actions-role
          aws-region: ap-southeast-4

      - name: Verify image passed Testing
        env:
          SHA: ${{ inputs.commit_sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1

          DIGEST=$(aws ecr describe-images \
            --repository-name book-library \
            --image-ids "imageTag=tested-$SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          if [[ -z "$DIGEST" || "$DIGEST" == "None" ]]; then
            echo "Image has not passed Testing!"
            exit 1
          fi

          echo "IMAGE=174302433391.dkr.ecr.ap-southeast-4.amazonaws.com/book-library@$DIGEST" >> "$GITHUB_ENV"

      - name: Deploy to Production EC2
        env:
          INSTANCE_ID: i-04d2c90c7a0e73710
        run: |
          REGISTRY="174302433391.dkr.ecr.ap-southeast-4.amazonaws.com"

          SCRIPT_BASE64=$(base64 -w 0 scripts/deploy-prod.sh)

          echo "Deploying verified image with automatic rollback: $IMAGE"

          COMMANDS=$(jq -nc \
            --arg registry "$REGISTRY" \
            --arg image "$IMAGE" \
            --arg script "$SCRIPT_BASE64" \
            '{
              commands: [
                "set -e",
                ("aws ecr get-login-password --region ap-southeast-4 | docker login --username AWS --password-stdin " + $registry),
                ("printf %s " + $script + " | base64 -d > /tmp/book-library-deploy-prod.sh"),
                ("bash /tmp/book-library-deploy-prod.sh " + $image)
              ]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$COMMANDS" \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query Status \
            --output text)

          test "$STATUS" = "Success"

          echo "Production deployment successful!"