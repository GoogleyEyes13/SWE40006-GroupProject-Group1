name: Promote to Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA of the tested Docker image"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: book-library-release
  cancel-in-progress: false
  queue: max

env:
  AWS_REGION: ap-southeast-4
  AWS_ROLE_ARN: arn:aws:iam::174302433391:role/book-library-github-actions-role
  ECR_REGISTRY: 174302433391.dkr.ecr.ap-southeast-4.amazonaws.com
  ECR_REPOSITORY: book-library
  PROD_INSTANCE_ID: i-04d2c90c7a0e73710

jobs:
  promote:
    name: Deploy Tested Image
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify image passed Testing
        id: image
        env:
          SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be the full 40 character commit SHA"
            exit 1
          fi

          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="tested-$SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)

          if [[ "$DIGEST" != sha256:* ]]; then
            echo "Image has not passed Testing!"
            exit 1
          fi

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Deploy to Production EC2
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: bash scripts/ssm-deploy.sh "$PROD_INSTANCE_ID" production "$IMAGE"
