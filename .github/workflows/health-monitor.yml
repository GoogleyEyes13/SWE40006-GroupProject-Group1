name: BookManager Health Monitor

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-4
  AWS_ROLE_ARN: arn:aws:iam::174302433391:role/book-library-github-actions-role
  PROD_URL: http://16.27.136.142
  PROD_INSTANCE_ID: i-04d2c90c7a0e73710

jobs:
  health-check:
    name: Production Health Monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check Production Website
        run: |
          curl --fail --silent --show-error \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 20 \
            --max-time 15 \
            "$PROD_URL/backend/health.php"

      - name: Check Production Database
        if: ${{ !cancelled() }}
        run: |
          bash scripts/ssm-run.sh "$PROD_INSTANCE_ID" \
            'for attempt in 1 2 3 4; do docker exec book-library-prod php /opt/book-library/database/db_health.php && exit 0; sleep 20; done; exit 1'
