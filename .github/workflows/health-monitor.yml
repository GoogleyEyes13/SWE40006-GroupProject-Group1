name: BookManager Health Monitor

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  health-check:
    name: Production Health Monitoring
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::174302433391:role/book-library-github-actions-role
          aws-region: ap-southeast-4

      - name: Check Production Website
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 15 \
            "http://16.27.136.142/backend/health.php"

      - name: Check Production Database
        if: always()
        env:
          INSTANCE_ID: i-04d2c90c7a0e73710
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["docker exec book-library-prod php /opt/book-library/database/db_health.php"]}' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query Status \
            --output text)

          test "$STATUS" = "Success"