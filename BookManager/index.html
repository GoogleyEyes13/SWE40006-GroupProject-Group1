<!DOCTYPE html>
<html>

<head>
    <title>Book Manager</title>
    <meta charset="utf-8" />
    <meta name="language" content="english" />

    <!-- CSS -->
    <link href="Framework/css/bootstrap.min.css" rel="stylesheet" />
    <link href="style.css" rel="stylesheet"/>

    <!-- JavaScript -->
    <script src="Framework/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <!-- Title -->
    <div class="container-fluid">
        <div class="row text-center">
            <div class="col-12 title-bg">
                <br><h1 class="title">Book Manager</h1><br>
            </div>
        </div>
    </div>

    <!-- Nav Bar -->
    <nav class="navbar navbar-expand">
        <div class="container-fluid p-0">
            <ul class="nav nav-justified w-100 text-center">
                <li class="nav-item">
                    <button class="nav-link text-white active w-100" data-bs-toggle="tab" data-bs-target="#library">
                        Library
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link text-white w-100" data-bs-toggle="tab" data-bs-target="#mycollection">
                        My Collection
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Tab Content -->
    <div class="tab-content">
        <!-- Library Tab-->
        <div class="tab-pane fade show active container-fluid" id="library">
            <p>Library Content</p>
        </div>
        
        <!-- My Collection Tab -->
        <div class="tab-pane fade container-fluid" id="mycollection">
            <p>My Collection Content</p>
        </div>
    </div>
</body>

</html>
